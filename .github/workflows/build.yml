name: Build and Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            artifact: py-count-java
            icon: icon.icns
          - os: windows-latest
            artifact: py-count-java.exe
            icon: icon.ico

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Build
        run: >-
          pyinstaller --onefile --name py-count-java
          --icon "${{ matrix.icon }}"
          py-count-java.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: py-count-java-${{ matrix.os }}
          path: dist/${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/py-count-java-macos-latest/py-count-java
            artifacts/py-count-java-windows-latest/py-count-java.exe
